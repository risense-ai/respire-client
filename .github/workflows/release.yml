# Manual desktop validation; publication requires an explicit input.
# Consume release-mode CLI artifacts from one successful, SHA-verified validation run.
name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Client git ref to validate (a version tag is required only for publication)
        default: main
        type: string
      cli_run_id:
        description: Successful respire-cli Release validation workflow run ID
        required: true
        type: string
      cli_sha:
        description: Exact 40-character CLI source commit recorded in its artifacts
        required: true
        type: string
      publish:
        description: Publish installers to respire-releases (requires its write token)
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      client_sha: ${{ steps.source.outputs.sha }}
    steps:
      - id: meta
        env:
          CLIENT_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          TAG="$CLIENT_REF"
          TAG="${TAG#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.meta.outputs.tag }}
      - name: Resolve the exact client revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require a completed release-mode CLI validation run
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_RUN_ID: ${{ inputs.cli_run_id }}
          CLI_SHA: ${{ inputs.cli_sha }}
        run: |
          set -euo pipefail
          [[ "$CLI_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::invalid CLI run ID"; exit 1; }
          [[ "$CLI_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::CLI SHA must be an exact lowercase commit"; exit 1; }
          gh api "repos/risense-ai/respire-cli/actions/runs/$CLI_RUN_ID" > cli-run.json
          jq -e '.status == "completed" and .conclusion == "success" and .path == ".github/workflows/release-validation.yml"' cli-run.json > /dev/null
      - name: tag must be on main
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::v* must be an ancestor of origin/main"
            exit 1
          fi
      - name: tag matches tauri version
        if: inputs.publish
        run: |
          VER="$(node -e "const j=require('./client/src-tauri/tauri.conf.json'); process.stdout.write(j.version)")"
          TAG="${{ steps.meta.outputs.tag }}"
          case "$TAG" in
            "v$VER") ;;
            v*) echo "::error::tag $TAG != tauri.conf.json $VER"; exit 1 ;;
            *) echo "::error::pass a v* tag (v$VER)"; exit 1 ;;
          esac
      - name: Ensure release exists
        if: inputs.publish
        env:
          DST_TOKEN: ${{ secrets.RELEASES_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DST_TOKEN:-}" ]; then
            echo "::error::secrets.RELEASES_GITHUB_TOKEN missing (contents:write on risense-ai/respire-releases)"
            exit 1
          fi
          TAG="${{ steps.meta.outputs.tag }}"
          if GH_TOKEN="$DST_TOKEN" gh release view "$TAG" --repo risense-ai/respire-releases >/dev/null 2>&1; then
            echo "release $TAG exists"
          else
            GH_TOKEN="$DST_TOKEN" gh release create "$TAG" --repo risense-ai/respire-releases --title "$TAG" --notes "respire desktop ${TAG}"
          fi

  client:
    name: client (${{ matrix.name }})
    needs: release
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm
            asset: respire-linux-x64.deb
            rpm_asset: respire-linux-x64.rpm
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm
            asset: respire-linux-arm64.deb
            rpm_asset: respire-linux-arm64.rpm
          - name: mac-arm64-dmg
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            asset: respire-macos-arm64.dmg
          - name: windows-x64-nsis
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            asset: respire-windows-x64-setup.exe
            rustflags: "-C target-feature=-crt-static"
            cflags: "/MD"
          - name: windows-arm64-nsis
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
            asset: respire-windows-arm64-setup.exe
            rustflags: "-C target-feature=-crt-static"
            cflags: "/MD"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.client_sha }}
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/tree-ui/package-lock.json
      - name: Build tree-ui
        working-directory: client/tree-ui
        run: |
          npm ci
          npm run build
      - name: Download the verified release-mode CLI sidecar
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_RUN_ID: ${{ inputs.cli_run_id }}
          CLI_SHA: ${{ inputs.cli_sha }}
        run: |
          set -euo pipefail
          T="${{ matrix.target }}"
          CLI_TARGET="$(node -e "const m=require('./contracts/compatibility-matrix.json'); process.stdout.write(m.cliArtifactTargets[process.argv[1]]);" "$T")"
          gh run download "$CLI_RUN_ID" --repo risense-ai/respire-cli \
            --name "cli-release-${CLI_TARGET}" --dir cli-artifact
          node build/verify-cli-artifact.mjs cli-artifact "$CLI_TARGET" "$CLI_SHA"
          tar -xzf "cli-artifact/rsrs-${CLI_TARGET}-runtime.tar.gz" -C cli-artifact
      - name: Fetch BGE model
        run: |
          set -euo pipefail
          mkdir -p models/bge-base-zh-v1.5/onnx
          REV=71e50dc531959f9e04ebf190ea25b00261a0a186
          B="https://hf-mirror.com/Xenova/bge-base-zh-v1.5/resolve/${REV}"
          dl() { curl -fsSL --retry 3 --retry-delay 5 -o "$2" "$1"; }
          dl "$B/tokenizer.json" models/bge-base-zh-v1.5/tokenizer.json
          dl "$B/onnx/model.onnx" models/bge-base-zh-v1.5/onnx/model.onnx
          cp cli-artifact/core-notices/models/FlagEmbedding-LICENSE.txt models/bge-base-zh-v1.5/LICENSE.txt
          cp cli-artifact/core-notices/models/bge-base-zh-v1.5-MODEL-CARD.md models/bge-base-zh-v1.5/MODEL-CARD.md
          cp cli-artifact/core-notices/models/sources.json models/bge-base-zh-v1.5/sources.json
          bash build/stage-desktop-bundle.sh verify-model
      - name: Stage sidecar
        run: bash build/stage-desktop-bundle.sh stage-sidecar cli-artifact "${{ matrix.target }}"
      - name: Linux bundle deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev rpm
      - name: Tauri build
        working-directory: client/src-tauri
        run: npx -y @tauri-apps/cli@2 build --config tauri.core-runtime.conf.json --bundles ${{ matrix.bundles }} --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          CFLAGS: ${{ matrix.cflags }}
          CXXFLAGS: ${{ matrix.cflags }}
          TARGET_CFLAGS: ${{ matrix.cflags }}
          TARGET_CXXFLAGS: ${{ matrix.cflags }}
      - name: Collect installers and source identities
        env:
          CLI_SHA: ${{ inputs.cli_sha }}
        run: |
          set -euo pipefail
          T="${{ matrix.target }}"
          mkdir -p dist
          shopt -s nullglob
          collect() {
            local dest="$1"
            shift
            [ -n "$dest" ] || return 0
            local src="" f
            for f in "$@"; do
              [ -f "$f" ] || continue
              src="$f"
              break
            done
            [ -n "$src" ] || { echo "::error::missing $dest"; exit 1; }
            cp "$src" "dist/$dest"
          }
          ROOT="client/src-tauri/target"
          collect "${{ matrix.asset }}" \
            "$ROOT/$T/release/bundle/deb/"*.deb \
            "$ROOT/$T/release/bundle/dmg/"*.dmg \
            "$ROOT/$T/release/bundle/nsis/"*.exe
          collect "${{ matrix.rpm_asset }}" "$ROOT/$T/release/bundle/rpm/"*.rpm
          git rev-parse HEAD > dist/client-sha.txt
          printf '%s\n' "$CLI_SHA" > dist/cli-sha.txt
          cp cli-artifact/cli-build-*.json dist/
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}-${{ needs.release.outputs.client_sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload to respire-releases
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.RELEASES_GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "dist/${{ matrix.asset }}" --repo risense-ai/respire-releases --clobber
          RPM="${{ matrix.rpm_asset }}"
          if [ -n "$RPM" ]; then
            gh release upload "$TAG" "dist/$RPM" --repo risense-ai/respire-releases --clobber
          fi
