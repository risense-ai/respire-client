[package]
name = "respire-client"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
description = "Respire desktop client shell built with Tauri"
license-file = "../../LICENSE"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"
