<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>respire 记忆库</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a;
    --fg: #e6e9ef; --dim: #8b93a3; --acc: #5b9dff; --ok: #46c07a; --warn: #e0a34a; --err: #e06c6c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Noto Sans CJK SC", sans-serif; background: var(--bg); color: var(--fg); height: 100vh; display: flex; }
  nav { width: 168px; background: var(--panel); border-right: 1px solid var(--line); padding: 14px 10px; flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; }
  .brand { font-weight: 700; font-size: 17px; padding: 4px 8px 14px; letter-spacing: .5px; }
  .brand small { display: block; font-weight: 400; color: var(--dim); font-size: 11px; margin-top: 3px; }
  nav button { all: unset; padding: 9px 12px; border-radius: 8px; cursor: pointer; color: var(--dim); font-size: 14px; }
  nav button:hover { background: var(--panel2); color: var(--fg); }
  nav button.on { background: var(--panel2); color: var(--acc); font-weight: 600; }
  nav .spacer { flex: 1; }
  nav .foot { font-size: 11px; color: var(--dim); padding: 8px; line-height: 1.6; }
  main { flex: 1; overflow: auto; padding: 18px 22px; }
  h2 { margin: 0 0 14px; font-size: 17px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  input[type=text], input[type=password], textarea, select {
    background: var(--panel2); border: 1px solid var(--line); color: var(--fg);
    border-radius: 8px; padding: 8px 10px; font-size: 14px; outline: none; font-family: inherit;
  }
  input:focus, textarea:focus { border-color: var(--acc); }
  select option { background: var(--panel2); color: var(--fg); }
  select { appearance: none; -webkit-appearance: none; padding-right: 26px;
    background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%);
    background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%;
    background-size: 5px 5px; background-repeat: no-repeat; }
  button.btn { background: var(--panel2); border: 1px solid var(--line); color: var(--fg); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 14px; }
  button.btn:hover { border-color: var(--acc); }
  button.btn.pri { background: var(--acc); border-color: var(--acc); color: #fff; font-weight: 600; }
  button.btn.danger { color: var(--err); }
  button.btn:disabled { opacity: .45; cursor: default; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .card .t { font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card .m { color: var(--dim); font-size: 12px; margin: 4px 0 6px; display: flex; gap: 10px; flex-wrap: wrap; }
  .card .c { white-space: pre-wrap; font-size: 13.5px; line-height: 1.65; color: #cdd3de; }
  .chip { font-size: 11px; border-radius: 20px; padding: 1px 9px; background: var(--panel2); border: 1px solid var(--line); color: var(--dim); }
  .chip.k-decision { color: #e0a34a; } .chip.k-skill { color: #5b9dff; } .chip.k-preference { color: #46c07a; }
  .chip.k-task { color: #d475e0; } .chip.k-emotion { color: #e06c6c; } .chip.k-knowledge { color: #58c5c0; }
  .score { color: var(--acc); font-size: 12px; font-weight: 600; }
  .pane { display: none; } .pane.on { display: block; }
  .stats { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 18px; min-width: 130px; }
  .stat .v { font-size: 22px; font-weight: 700; }
  .stat .l { color: var(--dim); font-size: 12px; margin-top: 2px; }
  /* Tree rows distinguish folders from leaf entries. */
  .tree { user-select: none; }
  .node { display: flex; align-items: baseline; gap: 7px; border-radius: 7px; padding: 3px 8px; cursor: pointer; }
  .node:hover { background: var(--panel2); }
  .node.sel { background: #233047; }
  .node .nt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node.d0 { font-size: 16.5px; font-weight: 700; background: var(--panel2); border: 1px solid var(--line); margin: 7px 0 3px; padding: 7px 10px; line-height: 1.5; }
  .node.d1 { font-size: 14.5px; font-weight: 600; }
  .node.d2 { font-size: 13.5px; font-weight: 400; color: #cdd3de; }
  .node.d3 { font-size: 13px; font-weight: 400; color: var(--dim); }
  .node .chip, .node .bdg { flex-shrink: 0; }
  .node.d0 .chip, .node.d1 .chip { display: none; }
  .bdg { font-size: 11px; color: var(--acc); background: rgba(91,157,255,.12); border-radius: 10px; padding: 0 7px; font-weight: 600; }
  .twisty { color: var(--dim); width: 14px; display: inline-block; text-align: center; flex-shrink: 0; }
  .kids { margin-left: 24px; border-left: 1px dashed var(--line); padding-left: 8px; line-height: 1.7; }
  .kids.hidden { display: none; }
  .leafdot { color: var(--dim); }
  /* Modal overlays. */
  dialog { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 18px; min-width: 520px; max-width: 720px; }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog h3 { margin: 0 0 12px; font-size: 15px; }
  .frm { display: grid; grid-template-columns: 76px 1fr; gap: 9px 10px; align-items: center; font-size: 13px; }
  .frm label { color: var(--dim); }
  .frm textarea { min-height: 110px; }
  .frm .full { grid-column: 1 / -1; }
  .cand { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 6px; font-size: 12.5px; }
  .cand b { color: var(--warn); }
  .toast { position: fixed; bottom: 18px; right: 18px; background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--acc); padding: 10px 16px; border-radius: 8px; font-size: 13px; z-index: 99; box-shadow: 0 4px 18px rgba(0,0,0,.4); }
  .toast.err { border-left-color: var(--err); }
  .toast.ok { border-left-color: var(--ok); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 500; font-size: 12px; }
  .st-fresh { color: var(--ok); } .st-stale { color: var(--warn); } .st-none, .st-absent { color: var(--dim); }
  .kv { font-size: 13px; line-height: 2; } .kv b { color: var(--dim); font-weight: 400; display: inline-block; width: 110px; vertical-align: top; }
  .kv .sub { color: var(--dim); font-size: 12px; margin-left: 114px; display: block; line-height: 1.7; margin-top: -4px; }
  code.key { background: var(--panel2); padding: 2px 8px; border-radius: 6px; word-break: break-all; font-size: 12px; }
  .detail-anc { color: var(--dim); font-size: 12.5px; margin-bottom: 6px; }
  #view { display: flex; gap: 16px; }
  #viewList { flex: 1.4; min-width: 0; }
  #viewDetail { flex: 1; min-width: 0; position: sticky; top: 0; align-self: flex-start; max-height: calc(100vh - 60px); overflow: auto; }
  @media (max-width: 980px) { #view { flex-direction: column; } #viewDetail { position: static; } }
</style>
</head>
<body>
<nav>
  <div class="brand">respire<small id="navUser">未登录</small></div>
  <button data-p="view" class="on">记忆浏览</button>
  <button data-p="book">成书与画像</button>
  <button data-p="tools">账号与同步</button>
  <button data-p="inject">注入管理</button>
  <div class="spacer"></div>
  <div class="foot" id="navStat"></div>
</nav>
<main>

<!-- Memory browser. -->
<section id="p-view" class="pane on">
  <div class="row">
    <input type="text" id="q" placeholder="语义搜索（回车；空 = 最近）" style="flex:1">
    <select id="kindFilter">
      <option value="">全部类型</option>
      <option>context</option><option>decision</option><option>preference</option>
      <option>task</option><option>emotion</option><option>time</option>
      <option>skill</option><option>knowledge</option>
    </select>
    <button class="btn pri" onclick="doSearch()">搜索</button>
    <button class="btn" onclick="showTree()">树形</button>
    <button class="btn" onclick="openCreate()">＋ 记一条</button>
  </div>
  <div id="view">
    <div id="viewList"></div>
    <div id="viewDetail"></div>
  </div>
</section>

<!-- Account and synchronization. -->
<section id="p-tools" class="pane">
  <h2>账号</h2>
  <div class="card" id="acctCard"></div>
  <h2>CLI</h2>
  <div class="card">
    <div class="row">
      <button class="btn pri" onclick="installCli()">安装记忆 CLI（npm）</button>
      <span style="color:var(--dim);font-size:12px">经 npm 装二进制（@rsrsai/cli），AI 软件直调 rsrs 命令。已有则跳过。</span>
    </div>
    <div id="cliOut" class="c" style="margin-top:8px"></div>
  </div>
  <h2>同步</h2>
  <div class="card" id="syncCard"></div>
  <h2>维护工具</h2>
  <div class="card">
    <div class="row">
      <button class="btn" onclick="exportJson()">导出记忆 JSON</button>
      <button class="btn" onclick="importJson()">导入记忆 JSON</button>
      <button class="btn" onclick="backupDb()">备份本地库</button>
      <button class="btn" onclick="runDefrag()">整理分析</button>
      <button class="btn" onclick="runReembed()">重算向量</button>
    </div>
    <div id="toolOut" class="c" style="margin-top:10px"></div>
  </div>
</section>

<!-- Book and profile views. -->
<section id="p-book" class="pane">
  <h2>记忆成书</h2>
  <p class="c" style="color:var(--dim);font-size:13px;margin-top:0">
    挑一棵主题树，导出全书材料（卷-章-节全文）——交给 AI 拟稿成书。材料只读，不动库。
  </p>
  <div class="row">
    <input type="text" id="bookRoot" placeholder="主题树根 id（8 位前缀，树视图里可点出）" style="flex:1">
    <button class="btn pri" onclick="makeBook()">导出成书材料</button>
    <button class="btn" onclick="copyOut()">复制</button>
  </div>
  <div id="bookOut"></div>

  <h2 style="margin-top:22px">人物画像</h2>
  <p class="c" style="color:var(--dim);font-size:13px;margin-top:0">
    汇总偏好/决策/情绪/技能 + 主题榜 + 时间线——交给 AI 拟人物画像。
  </p>
  <div class="row">
    <button class="btn pri" onclick="makePortrait()">生成画像材料</button>
    <button class="btn" onclick="copyOut()">复制</button>
  </div>
  <div id="portraitOut"></div>
</section>

<!-- Context injection. -->
<section id="p-inject" class="pane">
  <h2>记忆注入源分发</h2>
  <p class="c" style="color:var(--dim);font-size:13px;margin-top:0">
    把「言必检 / 遇障先翻忆 / 值必存」记忆铁律注入各 AI 软件之系统提示词——AI 开口先查忆、所得可入库。注入幂等，可重复执行；卸载可摘除。
  </p>
  <div id="injectList"></div>
</section>

</main>

<!-- Create and edit modal. -->
<dialog id="dlg">
  <h3 id="dlgTitle">记一条</h3>
  <div class="frm">
    <label>标题</label><input type="text" id="fTitle" placeholder="短标题（可空）">
    <label>类型</label>
    <select id="fKind">
      <option value="context">context · 上下文</option><option value="decision">decision · 决策</option>
      <option value="preference">preference · 偏好</option><option value="task">task · 任务</option>
      <option value="emotion">emotion · 情绪</option><option value="time">time · 时间</option>
      <option value="skill">skill · 技能</option><option value="knowledge">knowledge · 知识</option>
    </select>
    <label>标签</label><input type="text" id="fTags" placeholder="逗号分隔">
    <label>项目</label><input type="text" id="fProject" placeholder="（可空）">
    <label class="full">内容</label><textarea id="fContent" class="full" placeholder="正文。可用【前因】【行为】【后果】分段标记，因果链自明。"></textarea>
    <div id="candArea" class="full" style="display:none"></div>
    <div class="full row" style="justify-content:flex-end;margin:0">
      <button class="btn" onclick="dlg.close()">取消</button>
      <button class="btn pri" id="dlgSave">存入</button>
    </div>
  </div>
</dialog>

<!-- Detail modal. -->
<dialog id="dlgView">
  <h3 id="dvTitle"></h3>
  <div id="dvBody" class="c"></div>
  <div class="row" style="justify-content:flex-end;margin-top:14px">
    <button class="btn" onclick="dlgView.close()">关闭</button>
    <button class="btn" id="dvEdit">编辑</button>
    <button class="btn danger" id="dvDel">删除</button>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
